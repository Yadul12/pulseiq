services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseiq_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-pulseiq}
    ports:
      - "5480:5432"
    volumes:
      - pulseiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseiq} -d ${POSTGRES_DB:-pulseiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulseiq-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - pulseiq_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseiq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulseiq}:${POSTGRES_PASSWORD:-pulseiq_secret_2026}@postgres:5432/${POSTGRES_DB:-pulseiq}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pulseiq-enterprise-jwt-secret-key-2026-change-in-prod}
      CORS_ORIGINS: http://localhost:3080,http://localhost:5180,http://127.0.0.1:3080,http://127.0.0.1:5180
      ENABLE_SENTENCE_TRANSFORMERS: "false"
      SEED_RECORD_COUNT: "52000"
      AUTO_SEED_ON_STARTUP: "true"
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseiq-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulseiq}:${POSTGRES_PASSWORD:-pulseiq_secret_2026}@postgres:5432/${POSTGRES_DB:-pulseiq}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pulseiq-enterprise-jwt-secret-key-2026-change-in-prod}
      ENABLE_SENTENCE_TRANSFORMERS: "false"
    volumes:
      - ./data:/app/data

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseiq-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulseiq}:${POSTGRES_PASSWORD:-pulseiq_secret_2026}@postgres:5432/${POSTGRES_DB:-pulseiq}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pulseiq-enterprise-jwt-secret-key-2026-change-in-prod}
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulseiq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3080:80"

volumes:
  pulseiq_pgdata:
  pulseiq_redisdata:
